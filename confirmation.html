<!DOCTYPE html>
<html lang="en-NG">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MAX KITCHEN order confirmation.">
    <title>Order Confirmation | MAX KITCHEN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="confirmation-page">
        <section class="confirmation-panel confirmation-panel-wide" aria-labelledby="confirmation-title">
            <p class="section-label">MAX KITCHEN</p>
            <h1 id="confirmation-title">Order <em>Confirmed</em></h1>
            <p data-confirmation-message>Loading your demo payment details...</p>
            <div class="confirmation-order" data-confirmation-order hidden>
                <div class="confirmation-meta"><div><span>Order number</span><strong data-order-number></strong></div><div><span>Customer</span><strong data-order-customer></strong></div><div><span>Order status</span><strong data-order-status></strong></div></div>
                <div class="confirmation-items" data-order-items></div>
                <div class="confirmation-totals"><div><span>Subtotal</span><strong data-order-subtotal></strong></div><div><span>Delivery fee</span><strong data-order-delivery></strong></div><div class="confirmation-total"><span>Total paid</span><strong data-order-total></strong></div></div>
                <div class="confirmation-delivery"><span>Delivery details</span><strong data-order-address></strong><p data-order-eta></p></div>
                <div class="order-progress" aria-label="Order progress"><span class="is-current">Order Received</span><span>Preparing</span><span>Ready</span><span>Out for Delivery</span><span>Delivered</span></div>
            </div>
            <a class="button button-gold" href="menu.html">Return to menu</a>
        </section>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const formatPrice = (amount) => `₦${Number(amount).toLocaleString('en-NG')}`;
        const reference = params.get('reference');
        const message = document.querySelector('[data-confirmation-message]');
        const orderPanel = document.querySelector('[data-confirmation-order]');
        if (params.get('status') !== 'success' || !reference) {
            message.textContent = params.get('message') || 'We could not confirm this payment. Please contact MAX KITCHEN before trying again.';
        } else {
            const order = JSON.parse(window.localStorage.getItem('max-kitchen-last-order') || 'null');
            if (!order || order.paymentReference !== reference || order.paymentStatus !== 'Paid') {
                message.textContent = 'Payment was received, but this browser does not have the order details.';
            } else {
                message.textContent = 'Demo Payment Successful. No money was charged. MAX KITCHEN has received your demo order.';
                document.querySelector('[data-order-number]').textContent = order.orderNumber;
                document.querySelector('[data-order-customer]').textContent = order.customer.fullName;
                document.querySelector('[data-order-status]').textContent = order.status;
                document.querySelector('[data-order-items]').innerHTML = order.items.map((item) => `<article><div><strong>${item.name} <span>×${item.quantity}</span></strong>${(item.addOns || []).map((addon) => `<small>${addon.name} +${formatPrice(addon.price)}</small>`).join('')}</div><b>${formatPrice(item.price * item.quantity)}</b></article>`).join('');
                document.querySelector('[data-order-subtotal]').textContent = formatPrice(order.subtotal);
                document.querySelector('[data-order-delivery]').textContent = formatPrice(order.deliveryFee);
                document.querySelector('[data-order-total]').textContent = formatPrice(order.total);
                document.querySelector('[data-order-address]').textContent = order.customer.fulfilment === 'pickup' ? 'Pickup from MAX KITCHEN, 12 Quarry Road, GRA, Abeokuta.' : `${order.customer.address}, ${order.customer.area}, ${order.customer.city}`;
                document.querySelector('[data-order-eta]').textContent = order.customer.fulfilment === 'pickup' ? 'Estimated collection time: 20-30 minutes.' : 'Estimated delivery time: 45-60 minutes.';
                orderPanel.hidden = false;
            }
        }
    </script>
</body>
</html>
